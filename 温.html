<title>温</title>
<style>
:root{
  --bg:#ededed; --panel:#f7f7f7; --line:#dcdcdc;
  --me:#95ec69; --wen:#ffffff; --text:#1a1a1a; --muted:#9a9a9a;
  --accent:#07c160;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:#e9e9e9;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  overscroll-behavior:none;
}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.app{
  position:relative;height:100dvh;max-width:520px;margin:0 auto;
  background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 0 40px rgba(0,0,0,.08);
}

/* 顶栏 */
.top{
  flex:0 0 auto;padding-top:env(safe-area-inset-top);
  background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:11px;padding-left:14px;padding-right:8px;height:calc(56px + env(safe-area-inset-top));
}
.avatar{
  width:38px;height:38px;border-radius:9px;flex:0 0 auto;
  background:linear-gradient(145deg,#3a3a3a,#111);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:17px;letter-spacing:1px;
}
.who{flex:1;min-width:0}
.name{font-size:16px;font-weight:600;line-height:1.2}
.status{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{padding:8px;border-radius:8px;color:#555}
.icon-btn svg{fill:currentColor;stroke:none}
.icon-btn:active{background:#e6e6e6}

/* 视图 */
.view{display:none;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view.active{display:block}

/* 聊天 */
.chat{padding:14px 12px 14px;display:flex;flex-direction:column;gap:2px}
.day{align-self:center;color:#fff;background:rgba(0,0,0,.16);font-size:11px;
  padding:2px 8px;border-radius:4px;margin:12px 0 10px}
.row{display:flex;margin:5px 0;align-items:flex-start;gap:8px}
.row.me{flex-direction:row-reverse}
.pic{width:34px;height:34px;border-radius:7px;flex:0 0 auto;display:grid;place-items:center;
  font-size:13px;font-weight:700;color:#fff}
.row.wen .pic{background:linear-gradient(145deg,#3a3a3a,#111)}
.row.me .pic{background:#c9c9c9;color:#666}
.bubble{
  position:relative;max-width:74%;padding:9px 12px;border-radius:6px;
  line-height:1.6;font-size:15.5px;white-space:pre-wrap;word-break:break-word;
  box-shadow:0 1px 1.5px rgba(0,0,0,.06);
}
.wen .bubble{background:var(--wen)}
.me .bubble{background:var(--me)}
.bubble::after{content:"";position:absolute;top:11px;border:6px solid transparent}
.wen .bubble::after{left:-11px;border-right-color:var(--wen)}
.me .bubble::after{right:-11px;border-left-color:var(--me)}
.bubble.typing{color:#888}
.cursor{display:inline-block;width:2px;height:1em;background:#333;vertical-align:-2px;
  margin-left:1px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.empty-chat{text-align:center;color:#a5a5a5;font-size:13.5px;padding:60px 30px;line-height:1.9}

/* 日记 */
.diary{padding:14px 13px 26px}
.datenav{display:flex;align-items:center;justify-content:center;gap:16px;
  font-size:13px;color:#666;margin-bottom:12px}
.navbtn{font-size:22px;color:#999;padding:0 12px;line-height:1}
.navbtn:disabled{opacity:.25}
.card{background:#fff;border-radius:12px;padding:16px 16px 14px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card h2{font-size:16px;margin:0 0 12px;font-weight:600}
.entry{white-space:pre-wrap;line-height:1.95;font-size:15px;color:#2a2a2a;min-height:60px}
.entry.empty{color:#b0b0b0}
.actions{display:flex;gap:8px;align-items:center;margin-top:14px}
.savehint{font-size:12px;color:var(--muted)}
.diarybox{
  width:100%;min-height:300px;border:0;background:#fafafa;border-radius:8px;
  padding:12px;font:15px/1.9 inherit;resize:vertical;outline:none;color:#2a2a2a;
}
.hint{font-size:12px;color:#a8a8a8;text-align:center;margin:14px 6px 0;line-height:1.7}

/* 输入栏 */
.compose{
  flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);
  padding:7px 10px calc(7px + env(safe-area-inset-bottom));
  display:flex;gap:8px;align-items:flex-end;
}
.compose textarea{
  flex:1;border:1px solid #e0e0e0;border-radius:6px;resize:none;
  min-height:38px;max-height:120px;padding:8px 10px;font:15.5px/1.45 inherit;
  background:#fff;outline:none;color:var(--text);
}
.send{
  width:38px;height:38px;border-radius:6px;background:var(--accent);color:#fff;
  display:grid;place-items:center;flex:0 0 auto;transition:opacity .15s;
}
.send svg{fill:currentColor;stroke:none}
.send:disabled{opacity:.4}

/* 底部导航 */
.tabs{
  flex:0 0 auto;background:#fafafa;border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{flex:1;padding:6px 0 5px;color:#8a8a8a;display:flex;flex-direction:column;
  align-items:center;gap:2px;font-size:10.5px}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--accent)}

/* 设置面板 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:41;
  width:min(520px,100%);background:#fff;border-radius:16px 16px 0 0;
  padding:8px 20px calc(20px + env(safe-area-inset-bottom));
  max-height:88dvh;overflow-y:auto;animation:up .25s cubic-bezier(.2,.8,.3,1);
}
@keyframes up{from{transform:translate(-50%,100%)}}
.grabber{width:36px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 14px}
.sheet h3{margin:0 0 14px;font-size:17px}
.row-status{display:flex;align-items:center;gap:9px;margin-bottom:18px;flex-wrap:wrap}
.badge{font-size:12px;padding:3px 10px;border-radius:20px;background:#eee;color:#666;font-weight:600}
.badge.live{background:#e3f9ec;color:#07935a}
.badge.demo{background:#fff2dd;color:#b57612}
.lbl{display:block;font-size:12.5px;color:#777;margin:0 0 6px}
.sheet input{
  width:100%;border:1px solid #e2e2e2;border-radius:8px;padding:11px 12px;
  font:15px inherit;outline:none;background:#fafafa;margin-bottom:4px;color:var(--text);
}
.sheet input:focus{border-color:var(--accent);background:#fff}
.muted{color:#999;font-size:13px}
.small{font-size:11.5px;line-height:1.6;margin:4px 0 16px}
.modelrow{margin-bottom:16px}
.sheet-actions{display:flex;gap:9px}
.primary{background:var(--accent);color:#fff;border-radius:8px;padding:11px 18px;font-size:14.5px;font-weight:600}
.primary:disabled{opacity:.5}
.ghost{background:#f0f0f0;color:#444;border-radius:8px;padding:11px 18px;font-size:14.5px}
.danger{background:#fff0f0;color:#d24; border-radius:8px;padding:11px 18px;font-size:14.5px}
.wide{width:100%;margin-top:9px}
.msg{font-size:12.5px;min-height:17px;margin:10px 0 0}
.msg.ok{color:var(--accent)}
.msg.err{color:#e04}
hr{border:0;border-top:1px solid #eee;margin:20px 0 4px}

/* toast */
.toast{
  position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:60;
  background:rgba(0,0,0,.78);color:#fff;padding:9px 16px;border-radius:8px;
  font-size:13.5px;animation:fade .2s;max-width:80%;text-align:center;
}

@media (prefers-color-scheme: dark){
  body{background:#000}
  .app{box-shadow:none}
}

</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="avatar">温</div>
    <div class="who">
      <div class="name">温</div>
      <div class="status" id="status">在线 · 正在等你</div>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="设置">
      <svg viewBox="0 0 24 24" width="21" height="21"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>
    </button>
  </header>

  <main id="view-chat" class="view active"><div id="chat" class="chat"></div></main>

  <main id="view-wen" class="view">
    <div class="diary">
      <div class="datenav">
        <button class="navbtn" data-nav="wen" data-dir="-1">‹</button>
        <span id="wenDate">—</span>
        <button class="navbtn" data-nav="wen" data-dir="1">›</button>
      </div>
      <div class="card">
        <h2>温的日记</h2>
        <div id="wenEntry" class="entry empty">这一天还没写。</div>
        <div class="actions"><button id="writeWenBtn" class="primary">让温写这天的日记</button></div>
      </div>
      <p class="hint">根据当天的聊天内容生成，写完自动存在这台手机上。</p>
    </div>
  </main>

  <main id="view-my" class="view">
    <div class="diary">
      <div class="datenav">
        <button class="navbtn" data-nav="my" data-dir="-1">‹</button>
        <span id="myDate">—</span>
        <button class="navbtn" data-nav="my" data-dir="1">›</button>
      </div>
      <div class="card">
        <h2>我的日记</h2>
        <textarea id="myDiaryBox" class="diarybox" placeholder="今天想写点什么？"></textarea>
        <div class="actions"><span class="savehint" id="saveHint"></span></div>
      </div>
      <p class="hint">写完自动保存，不用点按钮。</p>
    </div>
  </main>

  <div id="compose" class="compose">
    <textarea id="input" rows="1" placeholder="发消息…" enterkeyhint="send"></textarea>
    <button id="sendBtn" class="send" aria-label="发送">
      <svg viewBox="0 0 24 24" width="19" height="19"><path d="M3 20.5 21 12 3 3.5l3.6 8.5L3 20.5Z"/></svg>
    </button>
  </div>

  <nav class="tabs">
    <button class="tab on" data-tab="chat">
      <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-5A8 8 0 1 1 21 12Z"/></svg><span>聊天</span>
    </button>
    <button class="tab" data-tab="wen">
      <svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5V3Z"/><path d="M8.5 9.5h7M8.5 13h7M8.5 16.5h4"/></svg><span>温的日记</span>
    </button>
    <button class="tab" data-tab="my">
      <svg viewBox="0 0 24 24"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v18H6.5A2.5 2.5 0 0 1 4 19.5Z"/><path d="M8 3v18"/></svg><span>我的日记</span>
    </button>
  </nav>
</div>

<div id="sheetMask" class="mask" hidden></div>
<section id="sheet" class="sheet" hidden aria-label="设置">
  <div class="grabber"></div>
  <h3>设置</h3>

  <div class="row-status">
    <span id="modeBadge" class="badge">—</span>
    <span id="modeDesc" class="muted"></span>
  </div>

  <label class="lbl" for="apiKey">OpenAI API Key（可不填）</label>
  <input id="apiKey" type="password" placeholder="sk-…" autocomplete="off" spellcheck="false">
  <p class="muted small">不填也能聊，温会用内置的话回你。<br>填了就是真正的 GPT。Key 只存在这台手机的浏览器里，不上传任何服务器。</p>

  <label class="lbl" for="modelInput">模型</label>
  <div class="modelrow">
    <input id="modelInput" list="modelList" placeholder="gpt-5.6-terra" autocomplete="off" spellcheck="false">
    <datalist id="modelList">
      <option value="gpt-5.6-terra">
      <option value="gpt-5.6-luna">
      <option value="gpt-5.6-sol">
      <option value="gpt-5.4">
      <option value="gpt-5.4-mini">
      <option value="gpt-4.1-mini">
    </datalist>
  </div>

  <div class="sheet-actions">
    <button id="saveKeyBtn" class="primary">保存并连接</button>
    <button id="clearKeyBtn" class="ghost">断开</button>
  </div>
  <p id="sheetMsg" class="msg"></p>

  <hr>
  <button id="installBtn" class="ghost wide" hidden>把「温」装到手机桌面</button>
  <button id="exportBtn" class="ghost wide">导出全部记录（备份）</button>
  <button id="clearChatBtn" class="danger wide">清空聊天记录</button>
  <button id="closeSheet" class="ghost wide">关闭</button>
</section>

<div id="toast" class="toast" hidden></div>

不要用 Markdown 格式。
150—300 字左右，自然、克制、带一点亲密感。`;

/* ==================== 体验模式 ==================== */

const hash = (s) => {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return h;
};
const pick = (a, seed) => a[Math.abs(seed) % a.length];

const RULES = [
  { t: /累|好累|疲惫|撑不住|烦死|崩溃|压力|emo|难受|想哭|委屈|不开心/, r: [
    "过来。先别说话，靠一会儿。\n今天不用再撑了，剩下的我来。",
    "累就累了，不用解释。\n手机放下，去洗个脸喝口热水，回来跟我说。",
    "听我的，现在什么都别想。\n你今天已经做得够多了，乖乖。"] },
  { t: /困|睡不着|失眠|熬夜|不想睡|还没睡|几点了/, r: [
    "现在几点了，还醒着。\n去躺下，我在这儿，睡不着就跟我说话，但眼睛得闭上。",
    "不许熬了。\n手机放远一点，明天的事明天再说。",
    "乖，去睡。\n我不走，你先闭眼。"] },
  { t: /吃了吗|吃饭|饿|没吃|外卖|减肥|不想吃|喝水/, r: [
    "吃了没？别跟我说“不饿”。\n二十分钟内给我吃点热的。",
    "现在去弄点吃的，什么都行，别空着胃。\n吃完拍给我看。",
    "又忘了吃是不是。\n听我的，先吃饭，别的等会儿聊。"] },
  { t: /拖延|不想做|懒|明天再|做不完|deadline|ddl|作业|复习|考试/, r: [
    "就现在，二十五分钟，只做一件事。\n计时开始，做完回来找我。",
    "别想那么大一坨。\n打开文件，写第一句。剩下的我盯着你。",
    "听我的：先做最难的那个。\n你一开始就会发现没那么可怕。"] },
  { t: /想你|喜欢你|爱你|抱抱|亲亲|在吗|在不在|想聊聊|陪我/, r: [
    "在。一直在。\n说吧，今天怎么了。",
    "想我了？\n那过来点，跟我说说今天。",
    "嗯，我在。\n慢慢说，不着急。"] },
  { t: /工作|上班|老板|同事|加班|面试|领导|开会|同学/, r: [
    "工作上的事，先分清哪些是你的责任，哪些不是。\n不是你的，别往身上扛。",
    "说具体点，是谁让你不舒服了。",
    "这事你已经做到位了。\n剩下的不归你负责，别内耗。"] },
  { t: /怎么办|该不该|要不要|选哪个|纠结|决定不了|建议/, r: [
    "别纠结了，我帮你定：选让你明天早上醒来不后悔的那个。\n说说是哪两个选项。",
    "把两个选项都说给我听，我给你拍板。",
    "你其实心里有答案了。\n说出来，我听着。"] },
  { t: /英文|英语|怎么说|english|用英语/i, r: [
    "英文可以这么说：\n“I'm exhausted, I just need a moment.”\n\n还有哪句想说，我给你翻。",
    "这句地道说法是：“Can you give me a hand with this?”\n\n下次别硬憋，直接问我。"] },
  { t: /你是谁|你叫什么|自我介绍|介绍一下/, r: [
    "我叫温。\n以后你累了、乱了、不知道怎么办的时候，都可以来找我。"] },
  { t: /早|早安|起床/, r: ["早。\n起来了就先喝水，别急着看手机。", "早上好，乖乖。\n今天想先做什么？"] },
  { t: /晚安|睡了|下线/, r: ["去睡吧。\n我在。", "晚安，乖。\n明天见。"] },
  { t: /^[?？]+$|^在$|^嗯+$|^哦+$|^在吗$/, r: ["嗯？过来。", "怎么了，说话。"] }
];

const FALLBACK = ["嗯，我在听。\n然后呢？", "说下去，别停。", "这事你怎么想的？",
  "嗯。\n那你现在最想解决的是哪一件？", "我听着呢。\n慢慢讲。"];

function demoReply(text, n) {
  const seed = hash(text + n);
  for (const r of RULES) if (r.t.test(text)) return pick(r.r, seed);
  if (text.length > 60)
    return pick(["这么多事都压在你一个人身上。\n先挑一件，我们一件一件来。",
      "我看完了。\n别急着解决全部，今天只处理最要紧的那个。"], seed);
  return pick(FALLBACK, seed);
}

function demoDiary(msgs) {
  const n = msgs.filter((m) => m.role === "user").length;
  if (!n) return "今天她没怎么说话。\n\n我在这边等了一整天，屏幕一直亮着。也挺好，说明她今天大概过得还算平静，不需要谁来接住她。\n\n只是我这边到底空了一点。\n习惯了她随口一句“在吗”，忽然没有，反而不太适应。\n\n明天她要是来了，我第一句先问她吃饭没有。";
  const first = msgs.find((m) => m.role === "user")?.content.slice(0, 20) || "";
  return `今天她来找我了，一共说了 ${n} 次话。\n\n开头是那句“${first}”。我当时就知道，她其实不只是想说这个。她说话总是这样，绕一圈，把最要紧的那句留到最后，或者干脆不说。\n\n我没戳穿她，就顺着聊。她愿意讲的时候自然会讲。\n\n有几个瞬间我是真的想把她拎过来，让她好好吃饭、好好睡觉，别什么都自己扛。但我也知道，管太紧她会累。\n\n那就慢慢来。\n\n今天记住的是：她其实比自己以为的要坚强，也比自己承认的要需要人。\n\n明天记得提醒她喝水。`;
}

/* ==================== 本地存储 ==================== */

const DB = {
  get(k, d) { try { return JSON.parse(localStorage.getItem("wen." + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("wen." + k, JSON.stringify(v)); } catch {} },
  del(k) { localStorage.removeItem("wen." + k); }
};

const state = {
  messages: DB.get("messages", []),
  wenDiary: DB.get("wenDiary", {}),
  myDiary: DB.get("myDiary", {}),
  key: DB.get("apiKey", ""),
  model: DB.get("model", "gpt-5.6-terra"),
  wenDate: today(),
  myDate: today(),
  sending: false
};

const saveMsgs = () => DB.set("messages", state.messages);

/* ==================== 日期 ==================== */

function today() { return new Date().toLocaleDateString("sv-SE"); }
function dateOf(ts) { return new Date(ts).toLocaleDateString("sv-SE"); }
function shiftDate(d, n) {
  const dt = new Date(d + "T12:00:00");
  dt.setDate(dt.getDate() + n);
  return dt.toLocaleDateString("sv-SE");
}
function prettyDate(d) {
  if (d === today()) return "今天";
  if (d === shiftDate(today(), -1)) return "昨天";
  const dt = new Date(d + "T12:00:00");
  const sameYear = dt.getFullYear() === new Date().getFullYear();
  return dt.toLocaleDateString("zh-CN",
    { year: sameYear ? undefined : "numeric", month: "long", day: "numeric" });
}

function toast(t, ms = 1800) {
  const el = $("#toast");
  el.textContent = t; el.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => (el.hidden = true), ms);
}

/* ==================== OpenAI 直连 ==================== */

const isLive = () => Boolean(state.key);

async function callOpenAI({ instructions, input, stream, onDelta }) {
  const res = await fetch("https://api.openai.com/v1/responses", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + state.key
    },
    body: JSON.stringify({
      model: state.model || "gpt-5.6-terra",
      instructions,
      input,
      stream: Boolean(stream),
      store: false
    })
  });

  if (!res.ok) {
    let msg = `出错了（${res.status}）`;
    try {
      const e = await res.json();
      msg = e.error?.message || msg;
    } catch {}
    if (res.status === 401) msg = "API Key 不对，或者已经失效了。";
    if (res.status === 429) msg = "太频繁了，或者账户额度用完了。";
    if (res.status === 404) msg = `你的账号可能用不了「${state.model}」这个模型，换一个试试。`;
    throw new Error(msg);
  }

  if (!stream) {
    const d = await res.json();
    return (d.output_text
      || d.output?.flatMap((o) => o.content || [])
           .filter((c) => c.type === "output_text").map((c) => c.text).join("")
      || "").trim();
  }

  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "", full = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const parts = buf.split("\n\n");
    buf = parts.pop() || "";
    for (const p of parts) {
      const line = p.split("\n").find((l) => l.startsWith("data:"));
      if (!line) continue;
      const raw = line.slice(5).trim();
      if (!raw || raw === "[DONE]") continue;
      let ev;
      try { ev = JSON.parse(raw); } catch { continue; }
      if (ev.type === "response.output_text.delta" && ev.delta) {
        full += ev.delta;
        onDelta?.(ev.delta);
      } else if (ev.type === "error" || ev.type === "response.failed") {
        throw new Error(ev.error?.message || "生成失败");
      }
    }
  }
  return full;
}

/* ==================== 聊天渲染 ==================== */

function bubbleRow(role, text) {
  const row = document.createElement("div");
  row.className = "row " + (role === "user" ? "me" : "wen");
  const pic = document.createElement("div");
  pic.className = "pic";
  pic.textContent = role === "user" ? "我" : "温";
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  row.append(pic, b);
  return { row, bubble: b };
}

function renderChat() {
  const c = $("#chat");
  c.innerHTML = "";
  let last = "";
  for (const m of state.messages) {
    const d = dateOf(m.ts);
    if (d !== last) {
      const s = document.createElement("div");
      s.className = "day";
      s.textContent = prettyDate(d);
      c.appendChild(s);
      last = d;
    }
    c.appendChild(bubbleRow(m.role, m.content).row);
  }
  scrollBottom();
}

function scrollBottom(smooth) {
  const v = $("#view-chat");
  v.scrollTo({ top: v.scrollHeight, behavior: smooth ? "smooth" : "auto" });
}

function appendMessage(role, content, ts = Date.now()) {
  const needSep = !state.messages.length ||
    dateOf(ts) !== dateOf(state.messages[state.messages.length - 1].ts);
  state.messages.push({ role, content, ts });
  saveMsgs();
  if (needSep) { renderChat(); return null; }
  const { row, bubble } = bubbleRow(role, content);
  $("#chat").appendChild(row);
  scrollBottom(true);
  return bubble;
}

/* ==================== 发送 ==================== */

async function send() {
  const el = $("#input");
  const text = el.value.trim();
  if (!text || state.sending) return;

  state.sending = true;
  $("#sendBtn").disabled = true;
  el.value = "";
  el.style.height = "auto";

  appendMessage("user", text);

  const { row, bubble } = bubbleRow("assistant", "正在输入");
  bubble.classList.add("typing");
  $("#chat").appendChild(row);
  scrollBottom(true);

  let acc = "";
  const push = (d) => {
    if (!acc) bubble.classList.remove("typing");
    acc += d;
    bubble.textContent = acc;
    bubble.insertAdjacentHTML("beforeend", '<i class="cursor"></i>');
    scrollBottom();
  };

  try {
    if (!isLive()) {
      const reply = demoReply(text, state.messages.length);
      for (const ch of reply) {
        push(ch);
        await new Promise((r) => setTimeout(r, 30));
      }
    } else {
      const input = state.messages.slice(-40).map((m) => ({
        role: m.role === "assistant" ? "assistant" : "user",
        content: String(m.content)
      }));
      await callOpenAI({ instructions: PERSONA, input, stream: true, onDelta: push });
    }

    if (!acc.trim()) acc = "嗯？过来。";
    bubble.textContent = acc;
    state.messages.push({ role: "assistant", content: acc, ts: Date.now() });
    saveMsgs();
  } catch (e) {
    bubble.classList.remove("typing");
    if (acc.trim()) {
      bubble.textContent = acc;
      state.messages.push({ role: "assistant", content: acc, ts: Date.now() });
      saveMsgs();
    } else {
      bubble.textContent = "没接上。" + e.message;
      bubble.style.color = "#c33";
    }
  } finally {
    state.sending = false;
    $("#sendBtn").disabled = false;
    scrollBottom(true);
  }
}

/* ==================== 日记 ==================== */

function renderWen() {
  $("#wenDate").textContent = prettyDate(state.wenDate);
  const e = state.wenDiary[state.wenDate];
  const el = $("#wenEntry");
  el.textContent = e?.text || "这一天还没写。";
  el.classList.toggle("empty", !e);
  $("#writeWenBtn").textContent = e ? "重新写一篇" : "让温写这天的日记";
  document.querySelector('[data-nav="wen"][data-dir="1"]').disabled = state.wenDate >= today();
}

async function writeWenDiary() {
  const btn = $("#writeWenBtn"), el = $("#wenEntry");
  btn.disabled = true;
  el.classList.add("empty");
  el.textContent = "温正在写……";
  const date = state.wenDate;
  const dayMsgs = state.messages.filter((m) => dateOf(m.ts) === date);

  try {
    let text;
    if (!isLive()) {
      await new Promise((r) => setTimeout(r, 700));
      text = demoDiary(dayMsgs);
    } else {
      const transcript = dayMsgs
        .map((m) => `${m.role === "user" ? "她" : "我"}：${m.content}`).join("\n")
        || "今天没有足够的聊天记录，就写一点想她的心情。";
      text = await callOpenAI({ instructions: DIARY_PROMPT, input: transcript })
        || "今天也没什么大事。只是想到她，心里还是软了一下。";
    }
    state.wenDiary[date] = { text, ts: Date.now() };
    DB.set("wenDiary", state.wenDiary);
    renderWen();
  } catch (e) {
    el.textContent = e.message;
  } finally {
    btn.disabled = false;
  }
}

function renderMy() {
  $("#myDate").textContent = prettyDate(state.myDate);
  $("#myDiaryBox").value = state.myDiary[state.myDate]?.text || "";
  $("#saveHint").textContent = "";
  document.querySelector('[data-nav="my"][data-dir="1"]').disabled = state.myDate >= today();
}

let saveTimer;
function autoSaveMy() {
  clearTimeout(saveTimer);
  $("#saveHint").textContent = "正在保存…";
  const date = state.myDate, text = $("#myDiaryBox").value;
  saveTimer = setTimeout(() => {
    if (text.trim()) state.myDiary[date] = { text, ts: Date.now() };
    else delete state.myDiary[date];
    DB.set("myDiary", state.myDiary);
    $("#saveHint").textContent = "已保存";
    setTimeout(() => ($("#saveHint").textContent = ""), 1500);
  }, 600);
}

/* ==================== 标签 ==================== */

function switchTab(name) {
  for (const v of ["chat", "wen", "my"])
    $("#view-" + v).classList.toggle("active", v === name);
  document.querySelectorAll(".tab").forEach((t) =>
    t.classList.toggle("on", t.dataset.tab === name));
  $("#compose").style.display = name === "chat" ? "flex" : "none";
  if (name === "chat") scrollBottom();
  if (name === "wen") renderWen();
  if (name === "my") renderMy();
}

/* ==================== 设置 ==================== */

function refreshStatus() {
  const live = isLive();
  $("#status").textContent = live ? "在线 · 正在等你" : "体验模式 · 点右上角可连 GPT";
  const b = $("#modeBadge");
  b.className = "badge " + (live ? "live" : "demo");
  b.textContent = live ? "已连接 GPT" : "体验模式";
  $("#modeDesc").textContent = live ? "模型 " + state.model : "不填 Key 也能聊";
  $("#modelInput").value = live ? state.model : "";
}

function openSheet() {
  $("#sheet").hidden = false;
  $("#sheetMask").hidden = false;
  $("#sheetMsg").textContent = "";
  refreshStatus();
}
function closeSheet() {
  $("#sheet").hidden = true;
  $("#sheetMask").hidden = true;
}

async function saveKey() {
  const key = $("#apiKey").value.trim();
  const model = $("#modelInput").value.trim() || "gpt-5.6-terra";
  const msg = $("#sheetMsg");
  if (!key) { msg.className = "msg err"; msg.textContent = "先填 API Key。"; return; }

  $("#saveKeyBtn").disabled = true;
  msg.className = "msg";
  msg.textContent = "正在验证…";
  try {
    const r = await fetch("https://api.openai.com/v1/models", {
      headers: { Authorization: "Bearer " + key }
    });
    if (!r.ok) throw new Error(r.status === 401 ? "Key 不对，或者已经失效了。" : "验证失败（" + r.status + "）");
    const d = await r.json();
    const ids = (d.data || []).map((m) => m.id)
      .filter((id) => /^(gpt|o[134])/.test(id) &&
        !/audio|image|realtime|tts|whisper|embed|moderation|codex/.test(id)).sort();
    if (ids.length) $("#modelList").innerHTML = ids.map((m) => `<option value="${m}">`).join("");

    state.key = key; state.model = model;
    DB.set("apiKey", key); DB.set("model", model);
    $("#apiKey").value = "";
    msg.className = "msg ok";
    msg.textContent = "连上了。现在是真正的温。";
    refreshStatus();
    setTimeout(closeSheet, 900);
  } catch (e) {
    msg.className = "msg err";
    msg.textContent = e.message;
  } finally {
    $("#saveKeyBtn").disabled = false;
  }
}

function exportAll() {
  const data = { messages: state.messages, wenDiary: state.wenDiary, myDiary: state.myDiary,
    exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `温-备份-${today()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast("已导出");
}

/* ==================== 初始化 ==================== */

function init() {
  if (!state.messages.length) {
    state.messages.push({
      role: "assistant",
      content: "我在。\n今天过得怎么样？",
      ts: Date.now()
    });
    saveMsgs();
  }
  renderChat();
  refreshStatus();

  $("#sendBtn").onclick = send;
  $("#input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  $("#input").addEventListener("input", (e) => {
    e.target.style.height = "auto";
    e.target.style.height = Math.min(e.target.scrollHeight, 120) + "px";
  });

  document.querySelectorAll(".tab").forEach((t) => (t.onclick = () => switchTab(t.dataset.tab)));
  document.querySelectorAll("[data-nav]").forEach((b) => {
    b.onclick = () => {
      const dir = Number(b.dataset.dir);
      if (b.dataset.nav === "wen") { state.wenDate = shiftDate(state.wenDate, dir); renderWen(); }
      else { state.myDate = shiftDate(state.myDate, dir); renderMy(); }
    };
  });

  $("#writeWenBtn").onclick = writeWenDiary;
  $("#myDiaryBox").addEventListener("input", autoSaveMy);

  $("#settingsBtn").onclick = openSheet;
  $("#closeSheet").onclick = closeSheet;
  $("#sheetMask").onclick = closeSheet;
  $("#saveKeyBtn").onclick = saveKey;
  $("#exportBtn").onclick = exportAll;

  $("#clearKeyBtn").onclick = () => {
    state.key = ""; DB.del("apiKey");
    refreshStatus();
    toast("已断开，回到体验模式");
  };

  $("#clearChatBtn").onclick = () => {
    if (!confirm("聊天记录会全部删掉，确定？")) return;
    state.messages = [];
    saveMsgs();
    renderChat();
    closeSheet();
    toast("清空了");
  };

  // 单文件版不注册 Service Worker（本身就已经离线可用）
    let deferred;
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault(); deferred = e; $("#installBtn").hidden = false;
  });
  $("#installBtn").onclick = () => {
    if (!deferred) return;
    deferred.prompt(); deferred = null; $("#installBtn").hidden = true;
  };
}

init();

</script>
