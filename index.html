<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f7">
<link rel="manifest" href="/manifest.json">
<title>温</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
.app{height:100dvh;max-width:520px;margin:auto;background:#ededed;display:flex;flex-direction:column}
.top{height:58px;background:#f7f7f7;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 14px;gap:11px}
.avatar{width:38px;height:38px;border-radius:9px;background:#222;color:#fff;display:grid;place-items:center;font-weight:700}
.name{font-size:16px;font-weight:600}.status{font-size:11px;color:#999;margin-top:2px}
.view{display:none;flex:1;overflow:auto}.view.active{display:block}
.chat{padding:16px 12px 92px;min-height:100%}.day{text-align:center;color:#aaa;font-size:11px;margin:4px 0 14px}
.row{display:flex;margin:8px 0}.row.me{justify-content:flex-end}.row.wen{justify-content:flex-start}
.bubble{max-width:76%;padding:10px 12px;border-radius:7px;line-height:1.55;font-size:15px;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 1px #ddd}
.wen .bubble{background:#fff}.me .bubble{background:#95ec69}
.compose{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#f7f7f7;border-top:1px solid #ddd;display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;border:1px solid #ddd;border-radius:6px;resize:none;min-height:42px;max-height:110px;padding:9px 10px;font:15px inherit;background:#fff;outline:none}
button{border:0;border-radius:7px;padding:10px 14px;background:#222;color:#fff;font-weight:600}.plus{background:#eee;color:#555;font-size:20px;padding:7px 12px}
.tabs{height:55px;background:#fafafa;border-top:1px solid #ddd;display:flex}.tab{flex:1;background:none;color:#777;border-radius:0;padding:0}.tab.on{color:#111;font-weight:700}
.diary{padding:18px 14px 30px}.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px}.card h2{font-size:17px;margin:0 0 12px}.date{font-size:12px;color:#aaa;margin-bottom:8px}.entry{white-space:pre-wrap;line-height:1.8;font-size:15px}
textarea.diarybox{width:100%;min-height:240px;max-height:none;border:0;background:#fafafa}
.actions{display:flex;gap:8px;margin-top:10px}.secondary{background:#eee;color:#333}
.loading{opacity:.55}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="avatar">温</div><div><div class="name">温</div><div class="status">在线 · 正在等你</div></div></header>

  <main id="chatView" class="view active"><div id="chat" class="chat"></div></main>

  <main id="wenDiary" class="view"><div class="diary">
    <div class="card"><h2>温的日记</h2><div class="date" id="wenDate"></div><div id="wenEntry" class="entry">今天还没写。</div>
    <div class="actions"><button onclick="makeWenDiary()">让温写今天的日记</button></div></div>
  </div></main>

  <main id="myDiary" class="view"><div class="diary">
    <div class="card"><h2>我的日记</h2><div class="date" id="myDate"></div>
    <textarea id="myDiaryBox" class="diarybox" placeholder="今天想写点什么？"></textarea>
    <div class="actions"><button onclick="saveMyDiary()">保存</button></div></div>
  </div></main>

  <div id="compose" class="compose"><button class="plus" onclick="quick()">＋</button><textarea id="input" rows="1" placeholder="发消息…"></textarea><button onclick="send()">发送</button></div>
  <nav class="tabs">
    <button id="tChat" class="tab on" onclick="switchTab('chat')">聊天</button>
    <button id="tWen" class="tab" onclick="switchTab('wen')">温的日记</button>
    <button id="tMy" class="tab" onclick="switchTab('my')">我的日记</button>
  </nav>
</div>
<script>
const KEY="wen_messages_v1", MY="wen_my_diary_v1", WEN="wen_wen_diary_v1";
let messages=JSON.parse(localStorage.getItem(KEY)||"[]");
const today=()=>new Date().toLocaleDateString("zh-CN",{year:"numeric",month:"long",day:"numeric"});
function render(){const c=document.querySelector("#chat");c.innerHTML='<div class="day">今天</div>';messages.forEach(m=>{const r=document.createElement("div");r.className="row "+(m.role==="user"?"me":"wen");const b=document.createElement("div");b.className="bubble";b.textContent=m.content;r.appendChild(b);c.appendChild(r)});c.scrollTop=c.scrollHeight}
async function send(){const el=document.querySelector("#input"),text=el.value.trim();if(!text)return;messages.push({role:"user",content:text});el.value="";save();render();const row=document.createElement("div");row.className="row wen";row.innerHTML='<div class="bubble loading">正在回你…</div>';document.querySelector("#chat").appendChild(row);try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages})});const d=await r.json();if(!r.ok)throw Error(d.error);messages.push({role:"assistant",content:d.text});save();render()}catch(e){row.querySelector(".bubble").textContent="先别急，接口还没接好。"+e.message}}
function save(){localStorage.setItem(KEY,JSON.stringify(messages))}
function quick(){document.querySelector("#input").value="在干嘛";document.querySelector("#input").focus()}
function switchTab(t){["chat","wen","my"].forEach(x=>{document.querySelector("#"+(x==="chat"?"chatView":x==="wen"?"wenDiary":"myDiary")).classList.toggle("active",x===t);document.querySelector("#t"+(x==="chat"?"Chat":x==="wen"?"Wen":"My")).classList.toggle("on",x===t)});document.querySelector("#compose").style.display=t==="chat"?"flex":"none";if(t==="wen")loadWen();if(t==="my")loadMy()}
async function makeWenDiary(){const el=document.querySelector("#wenEntry");el.textContent="温正在写……";try{const r=await fetch("/api/diary/wen",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages})});const d=await r.json();if(!r.ok)throw Error(d.error);el.textContent=d.text;localStorage.setItem(WEN,JSON.stringify({date:today(),text:d.text}))}catch(e){el.textContent=e.message}}
function loadWen(){document.querySelector("#wenDate").textContent=today();const d=JSON.parse(localStorage.getItem(WEN)||"null");document.querySelector("#wenEntry").textContent=d?.text||"今天还没写。"}
function loadMy(){document.querySelector("#myDate").textContent=today();document.querySelector("#myDiaryBox").value=localStorage.getItem(MY)||""}
function saveMyDiary(){localStorage.setItem(MY,document.querySelector("#myDiaryBox").value);alert("保存好了。")}
document.querySelector("#input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}})
render();loadWen();
if(!messages.length){messages=[{role:"assistant",content:"过来。先坐好。\n今天想跟我说点什么？"}];save();render()}
</script>
</body></html>
